spring.application.name=url-shortener
server.port=8080

app.base-url=http://localhost:8080
app.short-code.length=6

spring.jackson.serialization.write-dates-as-timestamps=false

#DataSource 
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=appuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver


#  HikariCP Connection Pool 
# Minimum idle connections kept alive in the pool
spring.datasource.hikari.minimum-idle=2

# Maximum connections the pool will ever create
spring.datasource.hikari.maximum-pool-size=10

# Milliseconds to wait for a connection before throwing an exception
spring.datasource.hikari.connection-timeout=20000

# Milliseconds a connection can sit idle before being removed
spring.datasource.hikari.idle-timeout=300000

#  JPA / Hibernate 
# NEVER use create or create-drop in production — data loss!
# validate: checks your entities match the DB schema (Flyway manages schema)
spring.jpa.hibernate.ddl-auto=validate

# Show generated SQL in logs (useful for learning; disable in prod)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use PostgreSQL dialect — tells Hibernate which SQL flavour to generate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#  Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=YXBwLWp3dC1zZWNyZXQta2V5LWZvci1zZWN1cmUtaHMyNTYtc2lnbmluZy0yMDI1LXNuaXBsaW5r
app.jwt.expiration-ms=604800000
app.jwt.issuer=snip-link-app
