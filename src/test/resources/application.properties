# Test profile — uses in-memory H2 instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.base-url=http://localhost:8080
app.short-code.length=6

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (same secret, shorter expiry for tests)
app.jwt.secret=YXBwLWp3dC1zZWNyZXQta2V5LWZvci1zZWN1cmUtaHMyNTYtc2lnbmluZy0yMDI1LXNuaXBsaW5r
app.jwt.expiration-ms=3600000
app.jwt.issuer=snip-link-app
